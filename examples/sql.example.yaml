# Copie este archivo fuera del repositorio como mi_caso.local.yaml.
# Sustituya servidor, base, consultas y mapeos por los de su organización.
# Las consultas pueden usar marcadores ? con listas en params.
fuente:
  sql:
    server: "MI_SERVIDOR"
    database: "MI_BASE"
    driver: "ODBC Driver 18 for SQL Server"
    trusted_connection: true
    max_rows: 50000
    queries:
      transacciones: |
        SELECT id_evento, actor, contraparte, fecha, cantidad, tipo_evento,
               canal, modalidad, tipo_actor, nombre_contraparte
        FROM dbo.MisFlujos
        WHERE fecha >= ?
      vinculados: ""
      nombres: ""
    params:
      transacciones: ["2026-01-01"]
      vinculados: []
      nombres: []
