[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "red-flujos"
version = "0.1.0"
description = "Análisis local de redes de flujos y relaciones"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "pandas>=2.0",
  "numpy>=1.24",
  "networkx>=3.2",
  "scipy>=1.11",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
excel = ["openpyxl>=3.1"]
sql = ["pyodbc>=5.0"]
dashboard = ["streamlit>=1.58", "plotly>=5.18", "pyvis>=0.3.2", "openpyxl>=3.1"]
test = ["pytest>=8.0"]

[project.scripts]
red-flujos = "run_demo:main"

[tool.setuptools]
py-modules = ["run_demo"]

[tool.setuptools.packages.find]
include = ["red_flujos*"]

[tool.setuptools.package-data]
red_flujos = ["config.yaml", "demo_data/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
